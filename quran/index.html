    <script>

       function normalizeText(text) {
            return text.replace(/[إأآا]/g, "ا")  // توحيد الألف بأشكالها
                .replace(/[ى]/g, "ي")     // توحيد الياء والألف المقصورة
                .replace(/[\u064B-\u065F]/g, "") // حذف التشكيل بالكامل
                .toLowerCase();
        }

        function filterNames() {
            let input = normalizeText(document.getElementById("searchBar").value);
            let buttons = document.querySelectorAll(".azkar-item");

            buttons.forEach(button => {
                let text = normalizeText(button.innerText);
                button.style.display = text.includes(input) ? "block" : "none";
            });
        }


        
        function openRecitationPage(sheikh) {
            window.location.href = `recitation.html?sheikh=${encodeURIComponent(sheikh)}`;
        }
    </script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ✅ إعداد Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCmCecvEhU5Q2SaLzngnAM6AX9qeNOJE98",
        authDomain: "praynotify.firebaseapp.com",
        databaseURL: "https://praynotify-default-rtdb.firebaseio.com/",
        projectId: "praynotify",
        storageBucket: "praynotify.appspot.com",
        messagingSenderId: "825282016133",
        appId: "1:825282016133:web:2c3d64ddf1024ddadc8aec",
        measurementId: "G-DKLRSZDEEY"
    };

    // ✅ تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const quranVisitsRef = ref(db, "page_visits/quran");

    // ✅ تحديث عدد زيارات صفحة القرآن الكريم ككائن
    get(quranVisitsRef).then(snapshot => {
        let visits = { count: 1 };
        if (snapshot.exists()) {
            let data = snapshot.val();
            visits.count = (data.count || 0) + 1;  // زيادة العدد داخل الكائن
        }
        return update(quranVisitsRef, visits);
    }).catch(error => console.error("❌ خطأ في تحديث زيارات صفحة القرآن الكريم:", error));
</script>
