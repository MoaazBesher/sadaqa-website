<div id="sidebar-container">
    <style>
/* Sidebar Styles - Modern Version */
:root {
    --primary: #ffd700;
    --primary-dark: #e6c200;
    --primary-light: rgba(255, 215, 0, 0.15);
    --bg-dark: #0a0c0f;
    --bg-card: #14181c;
    --bg-card-hover: #1a1f24;
    --text-primary: #ffffff;
    --text-secondary: #b0b7c0;
    --border-color: rgba(255, 215, 0, 0.1);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
    --shadow-gold: 0 8px 24px rgba(255, 215, 0, 0.15);
    --gradient-gold: linear-gradient(135deg, var(--primary) 0%, #b8860b 100%);
    --gradient-sidebar: linear-gradient(145deg, #14181c 0%, #1e2429 100%);
    --border-radius-md: 12px;
    --border-radius-lg: 20px;
    --transition-normal: 0.3s ease;
}

/* Menu Button - تصميم عصري */
.menu-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    font-size: 24px;
    background: var(--gradient-sidebar);
    color: var(--primary);
    border: 1px solid var(--border-color);
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    z-index: 1100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-normal);
    backdrop-filter: blur(10px);
}

.menu-btn:hover {
    transform: rotate(90deg) scale(1.1);
    background: var(--primary);
    color: var(--bg-dark);
    border-color: var(--primary);
    box-shadow: var(--shadow-gold);
}

.menu-btn:active {
    transform: rotate(90deg) scale(0.95);
}

/* Sidebar - تصميم أنيق */
.sidebar {
    position: fixed;
    left: -320px;
    top: 0;
    width: 300px;
    height: 100vh;
    background: var(--gradient-sidebar);
    color: var(--primary);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 80px 15px 20px;
    box-shadow: var(--shadow-md);
    border-left: 1px solid var(--border-color);
    z-index: 1000;
    overflow-y: auto;
    backdrop-filter: blur(10px);
}

.sidebar.active {
    left: 0;
}

/* تزيين القائمة الجانبية */
.sidebar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at top left, var(--primary-light), transparent 70%);
    pointer-events: none;
    opacity: 0.5;
}

/* Header القائمة الجانبية */
.sidebar-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid var(--border-color);
    text-align: center;
    backdrop-filter: blur(10px);
}

.sidebar-header h3 {
    margin: 0;
    font-size: 1.5rem;
    font-family: 'Thuluth', 'Cairo', sans-serif;
    color: var(--primary);
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

/* أزرار القائمة الجانبية */
.sidebar button {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 8px 0;
    padding: 14px 18px;
    border: none;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-secondary);
    text-align: right;
    font-size: 1rem;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    transition: all var(--transition-normal);
    border-radius: var(--border-radius-md);
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
}

/* إضافة أيقونات قبل النص (اختياري) */
.sidebar button::before {
    content: "•";
    color: var(--primary);
    font-size: 1.5rem;
    opacity: 0.5;
    transition: all var(--transition-normal);
}

.sidebar button:hover::before {
    opacity: 1;
    transform: scale(1.2);
}

.sidebar button:hover {
    background: var(--primary-light);
    color: var(--primary);
    border-color: rgba(255, 215, 0, 0.3);
    transform: translateX(-5px);
    box-shadow: var(--shadow-gold);
}

.sidebar button:active {
    transform: translateX(-2px);
}

/* تأثير تموج عند الضغط */
.sidebar button::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 215, 0, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.sidebar button:active::after {
    width: 200px;
    height: 200px;
}

/* زر إغلاق القائمة */
.close-sidebar-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: rgba(255, 215, 0, 0.1);
    border: 1px solid var(--border-color);
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-normal);
    z-index: 1001;
}

.close-sidebar-btn:hover {
    background: var(--primary);
    color: var(--bg-dark);
    transform: rotate(90deg);
}

/* Overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    z-index: 999;
    backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity var(--transition-normal);
}

.overlay.active {
    display: block;
    opacity: 1;
}

/* تصميم متجاوب للشاشات الصغيرة */
@media screen and (max-width: 768px) {
    .sidebar {
        width: 260px;
        left: -280px;
        padding: 70px 12px 15px;
    }

    .menu-btn {
        width: 45px;
        height: 45px;
        font-size: 20px;
        top: 15px;
        left: 15px;
    }

    .sidebar button {
        padding: 12px 15px;
        font-size: 0.95rem;
    }

    .sidebar-header h3 {
        font-size: 1.3rem;
    }

    .close-sidebar-btn {
        width: 30px;
        height: 30px;
    }
}

@media screen and (max-width: 480px) {
    .sidebar {
        width: 220px;
        left: -240px;
    }

    .menu-btn {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }

    .sidebar button {
        padding: 10px 12px;
        font-size: 0.9rem;
    }
}

/* دعم RTL للتأكد من الاتجاه */
[dir="rtl"] .sidebar {
    left: auto;
    right: -320px;
}

[dir="rtl"] .sidebar.active {
    left: auto;
    right: 0;
}

[dir="rtl"] .menu-btn {
    left: auto;
    right: 20px;
}

[dir="rtl"] .sidebar button:hover {
    transform: translateX(5px);
}

@media screen and (max-width: 768px) {
    [dir="rtl"] .sidebar {
        right: -280px;
    }
    
    [dir="rtl"] .menu-btn {
        right: 15px;
    }
}

/* أنيميشن دخول القائمة */
@keyframes slideIn {
    from {
        transform: translateX(-100%);
    }
    to {
        transform: translateX(0);
    }
}

.sidebar.active {
    animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* تخصيص شريط التمرير للقائمة الجانبية */
.sidebar::-webkit-scrollbar {
    width: 5px;
}

.sidebar::-webkit-scrollbar-track {
    background: transparent;
}

.sidebar::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 3px;
}

.sidebar::-webkit-scrollbar-thumb:hover {
    background: var(--primary-dark);
}
    </style>

    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let overlay = document.getElementById("overlay");
            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
        }

        function closeSidebar() {
            document.getElementById("sidebar").classList.remove("active");
            document.getElementById("overlay").classList.remove("active");
        }

        function openLink(url) {
            window.location.href = url;
            closeSidebar();
        }
    </script>

    <script>

       function normalizeText(text) {
            return text.replace(/[إأآا]/g, "ا")  // توحيد الألف بأشكالها
                .replace(/[ى]/g, "ي")     // توحيد الياء والألف المقصورة
                .replace(/[\u064B-\u065F]/g, "") // حذف التشكيل بالكامل
                .toLowerCase();
        }

        function filterNames() {
            let input = normalizeText(document.getElementById("searchBar").value);
            let buttons = document.querySelectorAll(".azkar-item");

            buttons.forEach(button => {
                let text = normalizeText(button.innerText);
                button.style.display = text.includes(input) ? "block" : "none";
            });
        }


        
        function openRecitationPage(sheikh) {
            window.location.href = `recitation.html?sheikh=${encodeURIComponent(sheikh)}`;
        }
    </script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ✅ إعداد Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCmCecvEhU5Q2SaLzngnAM6AX9qeNOJE98",
        authDomain: "praynotify.firebaseapp.com",
        databaseURL: "https://praynotify-default-rtdb.firebaseio.com/",
        projectId: "praynotify",
        storageBucket: "praynotify.appspot.com",
        messagingSenderId: "825282016133",
        appId: "1:825282016133:web:2c3d64ddf1024ddadc8aec",
        measurementId: "G-DKLRSZDEEY"
    };

    // ✅ تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const quranVisitsRef = ref(db, "page_visits/quran");

    // ✅ تحديث عدد زيارات صفحة القرآن الكريم ككائن
    get(quranVisitsRef).then(snapshot => {
        let visits = { count: 1 };
        if (snapshot.exists()) {
            let data = snapshot.val();
            visits.count = (data.count || 0) + 1;  // زيادة العدد داخل الكائن
        }
        return update(quranVisitsRef, visits);
    }).catch(error => console.error("❌ خطأ في تحديث زيارات صفحة القرآن الكريم:", error));
</script>
