<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css"> 
    <title>المصحف الشريف</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<header class="islamic-header">
    <h1 class="animated-title">
        <a style="color: inherit; text-decoration: none;">المصحف الشريف</a>
    </h1>
</header>
    



    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebar");
            let overlay = document.getElementById("overlay");
            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
        }

        function closeSidebar() {
            document.getElementById("sidebar").classList.remove("active");
            document.getElementById("overlay").classList.remove("active");
        }

        function openLink(url) {
            window.location.href = url;
            closeSidebar();
        }
    </script>
</div>


<section>
    <input type="text" id="searchBar" placeholder="ابحث عن سورة..." onkeyup="filterSurahs()">

    <a href="https://drive.google.com/file/d/1VICi1yTmdrSqNeDlKicCNhyPK8pmXuwi/view?usp=drive_link" class="download-button" target="_blank">تحميل المصحف PDF</a>

    <div id="surahList" class="surah-grid">
        <!-- Surahs will be dynamically injected here -->
    </div>

    <div id="surahReader" style="display: none;">
        
        <div class="floating-controls">
            <button class="floating-back-btn" onclick="closeSurah()" title="العودة للسور">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="reader-search-container">
                <input type="text" id="readerSearchBar" placeholder="بحث..." onkeyup="filterReader(event)">
                <div class="search-nav" id="searchNav" style="display: none;">
                    <span id="searchResultCount">0</span>
                    <div class="search-arrows">
                        <button onclick="navigateSearch(-1)"><i class="fas fa-chevron-up"></i></button>
                        <button onclick="navigateSearch(1)"><i class="fas fa-chevron-down"></i></button>
                    </div>
                </div>
                <button class="floating-search-btn" onclick="toggleReaderSearch()" title="البحث في السورة">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div class="reader-header">
            <h2 id="readerSurahName"></h2>
            <p id="readerSurahInfo"></p>
        </div>
        <div class="reader-content" id="readerContent"></div>
    </div>

    
    <script>
        let quranData = [];

        function normalizeText(text) {
            return text.normalize("NFKD").replace(/[إأآا]/g, "ا").replace(/[ى]/g, "ي").replace(/[ةه]/g, "ه").replace(/ُ|َ|ِ|ّ|ْ|ٌ|ٍ|ً|ٰ|ۡ/g, "").toLowerCase();
        }

        function buildHighlightRegex(query) {
            // Remove diacritics from query just in case user typed them
            let cleanQuery = query.replace(/ُ|َ|ِ|ّ|ْ|ٌ|ٍ|ً/g, "");
            let chars = cleanQuery.split('');
            let regexStr = chars.map(char => {
                if (char === 'ا' || char === 'أ' || char === 'إ' || char === 'آ') {
                    return '[اأإآ]';
                } else if (char === 'ي' || char === 'ى') {
                    return '[يى]';
                } else if (char === 'ه' || char === 'ة') {
                    return '[هة]';
                }
                // Escape regex special chars if any
                return char.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            }).join('[\\u0610-\\u061A\\u064B-\\u065F\\u0670]*');
            
            return new RegExp("(" + regexStr + ")", "gi");
        }

        
        function getVerseSnippet(verseText, query) {
            if (!query.trim() || verseText.length <= 80) return verseText;
            try {
                let regex = buildHighlightRegex(query);
                let match = regex.exec(verseText);
                if (match) {
                    let matchIndex = match.index;
                    let start = Math.max(0, matchIndex - 40);
                    let end = Math.min(verseText.length, matchIndex + query.length + 40);
                    
                    // expand to full words
                    while (start > 0 && verseText[start] !== ' ') start--;
                    while (end < verseText.length && verseText[end] !== ' ') end++;
                    
                    let snippet = verseText.substring(start, end).trim();
                    if (start > 0) snippet = "..." + snippet;
                    if (end < verseText.length) snippet = snippet + "...";
                    return snippet;
                }
            } catch(e) {}
            return verseText;
        }

        function highlightMatch(text, query) {
            if (!query.trim()) return text;
            try {
                let regex = buildHighlightRegex(query);
                return text.replace(regex, "<mark>$1</mark>");
            } catch(e) {
                return text;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetch('quran.json')
                .then(response => response.json())
                .then(data => {
                    quranData = data;
                    renderSurahs(quranData, "");
                })
                .catch(error => console.error('Error loading Quran data:', error));
        });

        function renderSurahs(surahs, query) {
            const container = document.getElementById("surahList");
            let html = "";
            
            surahs.forEach((surah) => {
                const typeAr = surah.type === 'meccan' ? 'مكية' : 'مدنية';
                
                html += `
                <div class="surah-card" onclick="openSurah(${surah.id})">
                    <div class="surah-card-main">
                        <div class="surah-number">
                            <div class="number-bg">${surah.id}</div>
                        </div>
                        <div class="surah-info">
                            <h3 class="surah-name">${surah.name}</h3>
                            <span class="surah-type">${typeAr} • ${surah.total_verses} آيات</span>
                        </div>
                    </div>`;
                
                if (surah.matchingVerses && surah.matchingVerses.length > 0) {
                    html += `<div class="verse-matches" onclick="event.stopPropagation(); openSurah(${surah.id}, ${surah.matchingVerses[0].id})">`;
                    html += `<div class="verse-matches-title">نتائج البحث في الآيات:</div>`;
                    surah.matchingVerses.slice(0, 3).forEach(verse => {
                        let snippet = getVerseSnippet(verse.text, query);
                        let highlightedVerse = highlightMatch(snippet, query);
                        html += `<div class="verse-match-item"> ${highlightedVerse} <span class="verse-match-num">﴿${verse.id}﴾</span></div>`;
                    });
                    if (surah.matchingVerses.length > 3) {
                        html += `<div class="verse-match-more">+ ${surah.matchingVerses.length - 3} نتائج أخرى في هذه السورة...</div>`;
                    }
                    html += `</div>`;
                }
                
                html += `</div>`;
            });
            
            if (html === "") {
                html = '<div class="no-results" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.2rem;">لا توجد نتائج مطابقة للبحث</div>';
            }
            
            container.innerHTML = html;
        }

        
        let currentReaderSurahId = null;
        let lastReaderSearchQuery = null;
        let currentMatchIndex = -1;
        let matchElements = [];

        function toggleReaderSearch() {
            const container = document.querySelector('.reader-search-container');
            container.classList.toggle('active');
            if (container.classList.contains('active')) {
                document.getElementById('readerSearchBar').focus();
            } else {
                document.getElementById('readerSearchBar').value = '';
                filterReader(); // clear search
            }
        }

        function updateSearchHighlight() {
            if (matchElements.length === 0) return;
            matchElements.forEach(el => el.classList.remove('active-mark'));
            const currentEl = matchElements[currentMatchIndex];
            if (currentEl) {
                currentEl.classList.add('active-mark');
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function navigateSearch(direction) {
            if (matchElements.length === 0) return;
            currentMatchIndex = (currentMatchIndex + direction + matchElements.length) % matchElements.length;
            updateSearchHighlight();
        }

        function filterReader(event) {
            let inputRaw = document.getElementById("readerSearchBar").value.trim();
            
            if (event && event.key === 'Enter') {
                navigateSearch(1);
                return;
            }
            
            if (inputRaw === lastReaderSearchQuery) {
                return; // only re-render if text changed
            }
            lastReaderSearchQuery = inputRaw;
            
            let input = normalizeText(inputRaw);
            
            if (!currentReaderSurahId) return;
            const surah = quranData.find(s => s.id === currentReaderSurahId);
            if (!surah) return;
            
            let versesHtml = "";
            if (surah.id !== 1 && surah.id !== 9) {
                versesHtml += `<div class="bismillah" style="text-align: center; margin-bottom: 20px; font-size: 1.8rem; color: var(--primary);">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>`;
            }

            let hasMatches = false;
            surah.verses.forEach(verse => {
                let verseTextNorm = normalizeText(verse.text);
                if (input === "" || verseTextNorm.includes(input)) {
                    hasMatches = true;
                    let textToDisplay = verse.text;
                    if (input) {
                        textToDisplay = highlightMatch(textToDisplay, inputRaw);
                    }
                    versesHtml += `<span class="verse-text" id="verse-${verse.id}">${textToDisplay} <span class="verse-num">﴿${verse.id}﴾</span> </span>`;
                }
            });
            
            if (!hasMatches) {
                versesHtml += `<div style="text-align: center; color: var(--text-muted); font-size: 1.2rem; margin-top: 40px;">لا توجد آيات مطابقة للبحث</div>`;
            }
            
            document.getElementById("readerContent").innerHTML = versesHtml;
            
            // Setup navigation
            matchElements = document.querySelectorAll('#readerContent mark');
            const searchNav = document.getElementById('searchNav');
            const searchResultCount = document.getElementById('searchResultCount');
            
            if (input && matchElements.length > 0) {
                searchNav.style.display = 'flex';
                searchResultCount.innerText = matchElements.length;
                currentMatchIndex = 0;
                updateSearchHighlight();
            } else {
                searchNav.style.display = 'none';
                currentMatchIndex = -1;
            }
        }

        function filterSurahs() {
            let inputRaw = document.getElementById("searchBar").value.trim();
            let input = normalizeText(inputRaw);
            
            if (!input) {
                renderSurahs(quranData, "");
                return;
            }
            
            let filteredData = [];
            
            quranData.forEach(surah => {
                let surahNameNorm = normalizeText(surah.name);
                let matchesName = surahNameNorm.includes(input);
                
                let matchingVerses = [];
                surah.verses.forEach(verse => {
                    let verseTextNorm = normalizeText(verse.text);
                    if (verseTextNorm.includes(input)) {
                        matchingVerses.push(verse);
                    }
                });
                
                if (matchesName || matchingVerses.length > 0) {
                    filteredData.push({
                        ...surah,
                        matchingVerses: matchingVerses
                    });
                }
            });
            
            renderSurahs(filteredData, inputRaw);
        }

        function openSurah(id, scrollToVerseId = null) {
            const surah = quranData.find(s => s.id === id);
            if (!surah) return;
            
            currentReaderSurahId = id;
            document.getElementById('readerSearchBar').value = '';
            const searchContainer = document.querySelector('.reader-search-container');
            if (searchContainer) searchContainer.classList.remove('active');
            
            // Push state so device back button works
            history.pushState({ surahOpen: true }, "سورة " + surah.name, "#surah-" + id);
            
            document.getElementById("surahList").style.display = "none";
            document.getElementById("searchBar").style.display = "none";
            document.querySelector(".download-button").style.display = "none";
            document.querySelector(".islamic-header").style.display = "none";
            const openSidebarBtn = document.querySelector("#open-sidebar");
            if(openSidebarBtn) openSidebarBtn.style.display = "none";
            document.getElementById("surahReader").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById("readerSurahName").innerText = "سورة " + surah.name;
            const typeAr = surah.type === 'meccan' ? 'مكية' : 'مدنية';
            document.getElementById("readerSurahInfo").innerText = `${typeAr} • ${surah.total_verses} آيات`;

            let versesHtml = "";
            
            if (id !== 1 && id !== 9) {
                versesHtml += `<div class="bismillah" style="text-align: center; margin-bottom: 20px; font-size: 1.8rem; color: var(--primary);">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>`;
            }

            let query = document.getElementById("searchBar").value.trim();

            surah.verses.forEach(verse => {
                let textToDisplay = verse.text;
                if (query) {
                    textToDisplay = highlightMatch(textToDisplay, query);
                }
                versesHtml += `<span class="verse-text" id="verse-${verse.id}">${textToDisplay} <span class="verse-num">﴿${verse.id}﴾</span> </span>`;
            });
            document.getElementById("readerContent").innerHTML = versesHtml;

            if (scrollToVerseId) {
                setTimeout(() => {
                    const el = document.getElementById("verse-" + scrollToVerseId);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.style.backgroundColor = "rgba(255, 215, 0, 0.2)";
                        el.style.borderRadius = "8px";
                        el.style.padding = "5px";
                        setTimeout(() => {
                            el.style.backgroundColor = "transparent";
                            el.style.transition = "background-color 2s ease";
                        }, 2000);
                    }
                }, 100);
            }
        }

        function hideReader() {
            document.getElementById("surahReader").style.display = "none";
            document.getElementById("surahList").style.display = "grid";
            document.getElementById("searchBar").style.display = "block";
            document.querySelector(".download-button").style.display = "block";
            document.querySelector(".islamic-header").style.display = "";
            const openSidebarBtn = document.querySelector("#open-sidebar");
            if(openSidebarBtn) openSidebarBtn.style.display = "";
        }

        function closeSurah() {
            if (history.state && history.state.surahOpen) {
                history.back(); // This will trigger popstate which calls hideReader
            } else {
                hideReader();
            }
        }

        // Listen for device back button
        window.addEventListener('popstate', (event) => {
            if (!event.state || !event.state.surahOpen) {
                hideReader();
            }
        });
    </script>

            authDomain: "praynotify.firebaseapp.com",
            databaseURL: "https://praynotify-default-rtdb.firebaseio.com/",
            projectId: "praynotify",
            storageBucket: "praynotify.appspot.com",
            messagingSenderId: "825282016133",
            appId: "1:825282016133:web:2c3d64ddf1024ddadc8aec",
            measurementId: "G-DKLRSZDEEY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mushafVisitsRef = ref(db, "page_visits/mushaf");

        get(mushafVisitsRef).then(snapshot => {
            let visits = { count: 1 };
            if (snapshot.exists()) {
                let data = snapshot.val();
                visits.count = (data.count || 0) + 1;
            }
            return update(mushafVisitsRef, visits);
        }).catch(error => console.error("❌ خطأ في تحديث زيارات صفحة المصحف الشريف:", error));
    </script>
</section>

        import { initSharedUI } from '../js/components.js';
        initSharedUI();
    </script>
</body>
