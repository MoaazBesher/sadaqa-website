</head>
<body>
    <div class="container animate-fade-in">
        <header class="islamic-header" style="margin-top: 3rem; margin-bottom: 2rem; text-align: center;">
            <h1 class="heading-brand text-gradient" style="font-size: 3rem; margin-bottom: 0.5rem;">مواعيد الصلاة</h1>
            <p style="color: var(--clr-text-muted); font-size: 1.1rem;">أوقات الصلاة حسب موقعك الجغرافي</p>
        </header>

        <!-- Notification Request -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <button id="request-notification" class="btn-primary" style="font-size: 1.1rem; padding: 1rem 2rem;">
                <i class="fas fa-bell"></i> تفعيل إشعارات الصلاة
            </button>
        </div>

        <section id="pray-times" style="display: block; max-width: 600px; margin: 0 auto 4rem;">
            <div class="prayer-container">
                <!-- Next Prayer Box -->
                <div class="glass-card" style="margin-bottom: 2rem; text-align: center; background: rgba(255, 215, 0, 0.05); border-color: var(--clr-primary);">
                    <p style="font-size: 1.25rem; color: var(--clr-text-muted); margin-bottom: 0.5rem;">الصلاة القادمة:</p>
                    <div id="next-prayer-name" style="font-size: 2.8rem; font-weight: bold; color: var(--clr-primary); margin-bottom: 1rem; font-family: var(--font-heading); text-shadow: 0 0 15px var(--clr-primary-glow);">جاري الحساب...</div>
                    <div style="background: rgba(0,0,0,0.5); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--clr-border);">
                        <p style="color: var(--clr-text-muted); font-size: 1.1rem; margin-bottom: 0.5rem;">الوقت المتبقي</p>
                        <div id="countdown-timer" style="font-size: 2.5rem; font-family: monospace; color: var(--clr-primary); letter-spacing: 3px; font-weight: bold;">00:00:00</div>
                    </div>
                </div>
                
                <!-- Prayer List -->
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <div class="glass-card interactive-card" style="flex-direction: row; padding: 1.25rem 2rem; justify-content: space-between;">
                        <span style="font-size: 1.5rem; font-family: var(--font-heading); display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-sun" style="color: var(--clr-text-muted);"></i> الفجر
                        </span>
                        <span id="fajr-time" style="font-size: 1.4rem; color: var(--clr-primary); font-weight: bold;">00:00 ص</span>
                    </div>
                    <div class="glass-card interactive-card" style="flex-direction: row; padding: 1.25rem 2rem; justify-content: space-between;">
                        <span style="font-size: 1.5rem; font-family: var(--font-heading); display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-sun" style="color: var(--clr-primary);"></i> الظهر
                        </span>
                        <span id="dhuhr-time" style="font-size: 1.4rem; color: var(--clr-primary); font-weight: bold;">00:00 م</span>
                    </div>
                    <div class="glass-card interactive-card" style="flex-direction: row; padding: 1.25rem 2rem; justify-content: space-between;">
                        <span style="font-size: 1.5rem; font-family: var(--font-heading); display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-sun" style="color: #ff9800;"></i> العصر
                        </span>
                        <span id="asr-time" style="font-size: 1.4rem; color: var(--clr-primary); font-weight: bold;">00:00 م</span>
                    </div>
                    <div class="glass-card interactive-card" style="flex-direction: row; padding: 1.25rem 2rem; justify-content: space-between;">
                        <span style="font-size: 1.5rem; font-family: var(--font-heading); display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-cloud-sun" style="color: #ff5722;"></i> المغرب
                        </span>
                        <span id="maghrib-time" style="font-size: 1.4rem; color: var(--clr-primary); font-weight: bold;">00:00 م</span>
                    </div>
                    <div class="glass-card interactive-card" style="flex-direction: row; padding: 1.25rem 2rem; justify-content: space-between;">
                        <span style="font-size: 1.5rem; font-family: var(--font-heading); display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-moon" style="color: var(--clr-text-muted);"></i> العشاء
                        </span>
                        <span id="isha-time" style="font-size: 1.4rem; color: var(--clr-primary); font-weight: bold;">00:00 م</span>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
    <script type="module">
        import { initSharedUI } from '../js/components.js';
        import { logPrayTimesVisit } from '../js/services.js';

        // 1. Initialize Sidebar & Overlay
        initSharedUI();

        // 2. Log Visit to specific Firebase DB feature
        logPrayTimesVisit();
