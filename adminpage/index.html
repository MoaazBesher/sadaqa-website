<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: #252525;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(255, 215, 0, 0.2);
            text-align: center;
        }
        .login-container input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            text-align: center;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #ffd700;
            color: #121212;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
        }
        .login-container button:hover {
            background-color: #e6c300;
        }
    </style>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
	
<!-- زر الرئيسية -->
<a href="https://sadaqa-mainpage.netlify.app/" class="home-btn">
    <i class="fas fa-home"></i>
</a>

<style>
    .home-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        font-size: 24px;
        background-color: #1E1E1E;
        color: white;
        text-decoration: none;
        padding: 12px;
        border-radius: 5px;
        cursor: pointer;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        z-index: 1100;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
    }
    .home-btn i {
        font-size: 22px;
        color: #FFD700; /* لون ذهبي مثل السايد بار */
    }
    .home-btn:hover {
        background-color: #333;
    }
</style>

<!-- مكتبة FontAwesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


    <div class="login-container">
        <h2>login page</h2>
        <input type="text" id="username" placeholder="user name">
        <input type="password" id="password" placeholder="password">
        <button onclick="checkLogin()">Enter</button>
    </div>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ✅ إعداد Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCmCecvEhU5Q2SaLzngnAM6AX9qeNOJE98",
        authDomain: "praynotify.firebaseapp.com",
        databaseURL: "https://praynotify-default-rtdb.firebaseio.com/",
        projectId: "praynotify",
        storageBucket: "praynotify.appspot.com",
        messagingSenderId: "825282016133",
        appId: "1:825282016133:web:2c3d64ddf1024ddadc8aec",
        measurementId: "G-DKLRSZDEEY"
    };

    // ✅ تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const failedAttemptsRef = ref(db, "failed_login_attempts"); // 🔥 مرجع عدد المحاولات الفاشلة


    // ✅ زيادة عدد المحاولات الفاشلة في Firebase
       function incrementFailedAttempts() {
            const failedAttemptsRef = ref(db, "failed_login_attempts");

            get(failedAttemptsRef).then(snapshot => {
                let attempts = snapshot.exists() ? snapshot.val().count || 0 : 0;
                update(failedAttemptsRef, { count: attempts + 1 })
                    .then(() => console.log("✅ تم تحديث عدد المحاولات الفاشلة:", attempts + 1))
                    .catch(error => console.error("❌ خطأ في تحديث العداد:", error));
            }).catch(error => console.error("❌ خطأ في جلب عدد المحاولات الفاشلة:", error));
        }

    // ✅ وظيفة التحقق من تسجيل الدخول
    window.checkLogin = function () {
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value.trim(); // 🔥 إزالة أي مسافات زائدة

        if (!username || !password) {
            alert("❌ الرجاء إدخال اسم المستخدم وكلمة المرور.");
            return;
        }

        // 🔥 البحث عن اسم المستخدم في قاعدة البيانات
        get(ref(db, `users/${username}`)).then(snapshot => {
            if (snapshot.exists()) {
                let correctPassword = snapshot.val(); // 🔥 جلب كلمة المرور
                correctPassword = String(correctPassword).trim(); // ✅ تأكد أنها نص

                console.log(`🔍 كلمة المرور من Firebase:`, correctPassword);
                console.log(`🔍 كلمة المرور المدخلة:`, password);

                if (password === correctPassword) {
                    window.location.href = 'suggestions.html';
                } else {
                    alert("❌ كلمة المرور غير صحيحة");
                    incrementFailedAttempts(); // 🔥 زيادة العداد عند الفشل
                }
            } else {
                alert("❌ اسم المستخدم غير موجود");
                incrementFailedAttempts(); // 🔥 زيادة العداد عند الفشل
            }
        }).catch(error => console.error("❌ خطأ في جلب البيانات:", error));
    };
</script>





    <script type="module">
        import { initSharedUI } from '../js/components.js';
        initSharedUI();
    </script>
</body>
</html>
